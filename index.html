<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>MTG Whiteboard</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #fff;
      font: 14px system-ui, sans-serif;
      color: #222;
    }

    #bar {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 10;
      opacity: .25;
      transition: opacity .2s;
      display: flex;
      gap: 4px;
    }

    #bar:hover,
    #bar:focus-within {
      opacity: 1;
    }

    #board {
      position: fixed;
      inset: 0;
    }

    svg {
      position: absolute;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    line {
      stroke: #d33;
      stroke-width: 4;
      marker-end: url(#head);
    }

    .card {
      position: absolute;
      width: 220px;
      height: 307px;
      border-radius: 10px;
      cursor: grab;
      user-select: none;
      touch-action: none;
      box-shadow: 0 2px 8px #0005;
      background: #fff;
    }

    .card img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      pointer-events: none;
      display: block;
    }

    .card .txt {
      display: none;
      box-sizing: border-box;
      height: 100%;
      padding: 10px;
      overflow: auto;
      border: 2px solid #444;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .card.text img {
      display: none;
    }

    .card.text .txt {
      display: block;
    }

    .card.sel {
      outline: 3px solid #36f;
    }

    .mode-arrow .card,
    .mode-box .card {
      cursor: crosshair;
    }

    .box {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #e90;
      background: #ffd70033;
      pointer-events: none;
    }

    .box.sel {
      border-color: #36f;
    }

    .note {
      position: absolute;
      z-index: 3;
      max-width: 220px;
      padding: 2px 6px;
      background: #fffbe0;
      border: 1px solid #bbb;
      font-size: 18px;
      white-space: pre-wrap;
      cursor: move;
      user-select: text;
      min-width: 1ch;
    }

    .note.sel {
      outline: 2px solid #36f;
    }

    .mode-text .card {
      cursor: text;
    }

    #tmp {
      stroke-dasharray: 6;
    }
  </style>
</head>

<body>
  <div id="bar">
    <input id="name" list="sugg" placeholder="Card name (/) + Enter" autocomplete="off">
    <datalist id="sugg"></datalist>
    <button id="arrow" title="A">Arrow (A)</button>
    <button id="box" title="B">Box (B)</button>
    <button id="text" title="T">Text (T)</button>
    <button id="turn" title="R">Turn over (R)</button>
    <button id="undo" title="Ctrl+Z">Undo (Z)</button>
    <button id="del" title="Delete">Delete (Del)</button>
    <button id="fs" title="F">Fullscreen (F)</button>
    <span id="msg"></span>
  </div>
  <div id="board">
    <svg>
      <defs>
        <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0L8,4L0,8z" fill="#d33" />
        </marker>
      </defs>
      <g id="arrows"></g>
      <line id="tmp" display="none" />
    </svg>
  </div>
  <script>
    const W = 220, H = 307;
    const $ = id => document.getElementById(id);
    const board = $('board'), arrowsG = $('arrows'), tmp = $('tmp'), msg = $('msg');
    let state = { cards: [], arrows: [], notes: [] }, history = [], sel = null, mode = 'move', nextId = 1;
    const base = n => n.c ? cardOf(n.c) : { x: 0, y: 0 };

    const snap = () => JSON.stringify(state);
    function commit() { history.push(snap()); }          // call before mutating
    function undo() {
      if (!history.length) return;
      state = JSON.parse(history.pop()); sel = null; render();
    }
    const cardOf = id => state.cards.find(c => c.id === id);
    const noteOf = id => state.notes.find(n => n.id === id);
    const pt = p => {
      const o = p.n ? noteOf(p.n) : cardOf(p.c), b = p.n ? base(o) : { x: 0, y: 0 };   // anchor-relative -> board coords
      return p.n ? [b.x + o.x + p.x, b.y + o.y + p.y] : [o.x + p.x, o.y + p.y];
    };
    function anchorAt(e) {          // arrow endpoint under the pointer: a note if any, else a card
      const t = document.elementFromPoint(e.clientX, e.clientY), ne = t?.closest('.note');
      if (ne) {
        const r = ne.getBoundingClientRect();
        return { n: +ne.dataset.id, x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)) };
      }
      const ce = t?.closest('.card');
      return ce ? rel(cardOf(+ce.dataset.id), e) : null;
    }
    const pruneArrows = () => { state.arrows = state.arrows.filter(a => [a.a, a.b].every(p => p.n ? noteOf(p.n) : cardOf(p.c))); };
    const rel = (c, e) => ({ c: c.id, x: Math.max(0, Math.min(W, e.clientX - c.x)), y: Math.max(0, Math.min(H, e.clientY - c.y)) });

    function render() {
      syncUrl();
      board.querySelectorAll('.card').forEach(e => e.remove());
      for (const c of state.cards) {
        const d = document.createElement('div');
        d.className = 'card' + (c.text ? ' text' : '') + (sel === 'c' + c.id ? ' sel' : '');
        d.dataset.id = c.id;
        d.style.left = c.x + 'px'; d.style.top = c.y + 'px';
        const face = c.faces[c.f];
        const img = document.createElement('img'); img.src = face.img; img.alt = face.name;
        const t = document.createElement('div'); t.className = 'txt'; t.textContent = face.oracle;
        d.append(img, t);
        (c.boxes || []).forEach((b, i) => {
          const e = document.createElement('div');
          e.className = 'box' + (sel === 'b' + c.id + ':' + i ? ' sel' : '');
          Object.assign(e.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
          d.append(e);
        });
        board.append(d);
      }
      board.querySelectorAll('.note').forEach(e => e.remove());
      for (const n of state.notes) {
        const e = document.createElement('div');
        e.className = 'note' + (sel === 'n' + n.id ? ' sel' : '');
        e.dataset.id = n.id; e.textContent = n.t;
        e.style.left = n.x + 'px'; e.style.top = n.y + 'px';
        (n.c ? board.querySelector(`.card[data-id="${n.c}"]`) : board).append(e);
      }
      drawArrows();
    }

    function drawArrows() {
      arrowsG.innerHTML = '';
      state.arrows.forEach((a, i) => {
        const [p1, p2] = [pt(a.a), pt(a.b)];
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', p1[0]); l.setAttribute('y1', p1[1]);
        l.setAttribute('x2', p2[0]); l.setAttribute('y2', p2[1]);
        if (sel === 'a' + i) l.style.stroke = '#36f';
        arrowsG.append(l);
        if (sel === 'a' + i) for (const p of [p1, p2]) {      // endpoint handles on the selected arrow
          const h = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          h.setAttribute('cx', p[0]); h.setAttribute('cy', p[1]); h.setAttribute('r', 7);
          h.setAttribute('fill', '#fff'); h.setAttribute('stroke', '#36f'); h.setAttribute('stroke-width', 2);
          arrowsG.append(h);
        }
      });
    }

    function arrowAt(x, y) {
      let best = -1, bd = 8;
      state.arrows.forEach((a, i) => {
        const [ax, ay] = pt(a.a), [bx, by] = pt(a.b);
        const dx = bx - ax, dy = by - ay, k = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1)));
        const d = Math.hypot(x - ax - k * dx, y - ay - k * dy);
        if (d < bd) { bd = d; best = i; }
      });
      return best;
    }

    let drag = null;
    function editNote(n) {
      const el = board.querySelector(`.note[data-id="${n.id}"]`), before = n.before, old = n.t;
      delete n.before;
      el.contentEditable = 'true'; el.focus();
      getSelection().selectAllChildren(el); getSelection().collapseToEnd();
      el.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Escape') el.blur(); });
      el.addEventListener('blur', () => {
        n.t = el.innerText.trim();
        if (!n.t) { state.notes = state.notes.filter(x => x !== n); pruneArrows(); }
        if (n.t !== old) history.push(before || snap0(n));
        render();
      }, { once: true });
    }
    const snap0 = n => JSON.stringify({ ...state, notes: state.notes.map(x => x === n ? { ...x, t: n.t } : x) });
    board.addEventListener('pointerdown', e => {
      if (document.activeElement?.isContentEditable) document.activeElement.blur();
      const tgt = document.elementFromPoint(e.clientX, e.clientY);
      const ne = tgt?.closest('.note'), note = ne && state.notes.find(n => n.id === +ne.dataset.id);
      if (mode === 'text') {
        const c = tgt?.closest('.card') && cardOf(+tgt.closest('.card').dataset.id);
        board.setPointerCapture(e.pointerId);
        drag = { type: 'text', note, c, e: { clientX: e.clientX, clientY: e.clientY } };
        return;
      }
      if (mode === 'move' && sel && sel[0] === 'a') {      // handles of the selected arrow win over notes underneath
        const a = state.arrows[+sel.slice(1)];
        for (const end of ['a', 'b']) {
          const [x, y] = pt(a[end]);
          if (Math.hypot(e.clientX - x, e.clientY - y) < 12) {
            board.setPointerCapture(e.pointerId);
            drag = { type: 'handle', a, end, before: snap(), moved: false };
            return;
          }
        }
      }
      if (mode === 'move' && note) {
        sel = 'n' + note.id;
        const b = base(note);
        board.setPointerCapture(e.pointerId);
        drag = { type: 'note', n: note, el: ne, ox: e.clientX - b.x - note.x, oy: e.clientY - b.y - note.y, before: snap(), moved: false };
        document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
        ne.classList.add('sel');
        return;
      }
      if (mode === 'move') {
        if (sel && sel[0] === 'a') {                       // grab an endpoint of the selected arrow to re-anchor it
          const i = +sel.slice(1), a = state.arrows[i];
          for (const end of ['a', 'b']) {
            const [x, y] = pt(a[end]);
            if (Math.hypot(e.clientX - x, e.clientY - y) < 12) {
              board.setPointerCapture(e.pointerId);
              drag = { type: 'handle', a, end, before: snap(), moved: false };
              return;
            }
          }
        }
        const ai = arrowAt(e.clientX, e.clientY);
        if (ai >= 0) { sel = 'a' + ai; render(); return; }
      }
      if (mode === 'arrow') {
        const a = anchorAt(e);
        if (!a) { sel = null; render(); return; }
        board.setPointerCapture(e.pointerId);
        drag = { type: 'arrow', a };
        tmp.removeAttribute('display'); updateTmp(e);
        return;
      }
      const el = tgt?.closest('.card');
      if (!el) { sel = null; render(); return; }
      const c = cardOf(+el.dataset.id);
      board.setPointerCapture(e.pointerId);
      sel = 'c' + c.id;
      if (mode === 'box') {
        const pv = document.createElement('div');
        pv.className = 'box'; el.append(pv);
        drag = { type: 'box', c, p: rel(c, e), pv, r: null };
      } else {
        // clicking inside a box selects it, while still allowing the card to be dragged
        const bi = (c.boxes || []).map((b, i) => [b, i]).reverse()
          .find(([b]) => e.clientX - c.x >= b.x && e.clientX - c.x <= b.x + b.w && e.clientY - c.y >= b.y && e.clientY - c.y <= b.y + b.h);
        if (bi) sel = 'b' + c.id + ':' + bi[1];
        drag = { type: 'move', c, el, ox: e.clientX - c.x, oy: e.clientY - c.y, before: snap(), moved: false };
        state.cards.push(state.cards.splice(state.cards.indexOf(c), 1)[0]);
        board.append(el);
        document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
        if (bi) el.querySelectorAll('.box')[bi[1]].classList.add('sel'); else el.classList.add('sel');
      }
    });
    function updateTmp(e) {
      const [x, y] = pt(drag.a);
      tmp.setAttribute('x1', x); tmp.setAttribute('y1', y);
      tmp.setAttribute('x2', e.clientX); tmp.setAttribute('y2', e.clientY);
    }
    board.addEventListener('pointermove', e => {
      if (!drag) return;
      if (drag.type === 'arrow') return updateTmp(e);
      if (drag.type === 'text') return;
      if (drag.type === 'note') {
        const b = base(drag.n);
        drag.n.x = e.clientX - drag.ox - b.x; drag.n.y = e.clientY - drag.oy - b.y;
        drag.el.style.left = drag.n.x + 'px'; drag.el.style.top = drag.n.y + 'px';
        drag.moved = true; drawArrows(); return;
      }
      if (drag.type === 'handle') {
        const t = anchorAt(e);
        if (t) { drag.a[drag.end] = t; drag.moved = true; drawArrows(); }
        return;
      }
      if (drag.type === 'box') {
        const q = rel(drag.c, e), p = drag.p;
        drag.r = { x: Math.min(p.x, q.x), y: Math.min(p.y, q.y), w: Math.abs(q.x - p.x), h: Math.abs(q.y - p.y) };
        Object.assign(drag.pv.style, { left: drag.r.x + 'px', top: drag.r.y + 'px', width: drag.r.w + 'px', height: drag.r.h + 'px' });
        return;
      }
      drag.moved = true;
      drag.c.x = e.clientX - drag.ox; drag.c.y = e.clientY - drag.oy;
      drag.el.style.left = drag.c.x + 'px'; drag.el.style.top = drag.c.y + 'px';
      drawArrows();
    });
    board.addEventListener('pointerup', e => {
      if (!drag) return;
      if (drag.type === 'text') {
        const d = drag; drag = null;
        if (d.note) { d.note.before = snap(); render(); editNote(d.note); return; }
        const before = snap(), p = d.c ? rel(d.c, d.e) : { x: d.e.clientX, y: d.e.clientY };
        const n = { id: nextId++, c: d.c ? d.c.id : null, x: p.x, y: p.y, t: '', before };
        state.notes.push(n); sel = 'n' + n.id; render(); editNote(n);
        return;
      }
      if (drag.type === 'arrow') {
        tmp.setAttribute('display', 'none');
        const b = anchorAt(e);
        if (b) {
          const [ax, ay] = pt(drag.a);
          if (Math.hypot(e.clientX - ax, e.clientY - ay) > 10) { commit(); state.arrows.push({ a: drag.a, b }); }
        }
      } else if (drag.type === 'note') {
        if (drag.moved) {
          const n = drag.n, b = base(n), ax = b.x + n.x, ay = b.y + n.y;
          // anchor to the topmost card under the pointer, or to the board if none
          const t = [...state.cards].reverse().find(c => e.clientX >= c.x && e.clientX <= c.x + W && e.clientY >= c.y && e.clientY <= c.y + H);
          n.c = t ? t.id : null;
          const nb = base(n); n.x = ax - nb.x; n.y = ay - nb.y;
          history.push(drag.before);
        }
      } else if (drag.type === 'handle') {
        if (drag.moved) history.push(drag.before);
      } else if (drag.type === 'box') {
        if (drag.r && drag.r.w > 6 && drag.r.h > 6) { commit(); (drag.c.boxes ||= []).push(drag.r); }
      } else if (drag.moved) history.push(drag.before);
      drag = null; render();
    });
    board.addEventListener('dblclick', e => {        // flip between image and readable text
      if (mode !== 'move') return;
      const ne = e.target.closest('.note');
      if (ne) { const n = state.notes.find(n => n.id === +ne.dataset.id); n.before = snap(); editNote(n); return; }
      const el = e.target.closest('.card'); if (!el) return;
      const c = cardOf(+el.dataset.id);
      commit(); c.text = !c.text; render();
    });

    function remove() {
      if (!sel) return;
      commit();
      if (sel[0] === 'c') {
        const id = +sel.slice(1);
        state.cards = state.cards.filter(c => c.id !== id);
        state.arrows = state.arrows.filter(a => a.a.c !== id && a.b.c !== id);
        state.notes = state.notes.filter(n => n.c !== id);
      } else if (sel[0] === 'n') {
        state.notes = state.notes.filter(n => n.id !== +sel.slice(1));
      } else if (sel[0] === 'b') {
        const [id, i] = sel.slice(1).split(':');
        cardOf(+id).boxes.splice(+i, 1);
      } else state.arrows.splice(+sel.slice(1), 1);
      pruneArrows(); sel = null; render();
    }

    async function addCard(name) {
      msg.textContent = '…';
      try {
        const r = await fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name));
        const j = await r.json();
        if (j.object === 'error') throw new Error(j.details);
        const raw = j.card_faces || [j];
        const faces = raw.map(f => ({
          name: f.name, img: (f.image_uris || j.image_uris).normal,
          oracle: `${f.name}  ${f.mana_cost || ''}\n${f.type_line}\n\n${f.oracle_text || ''}` +
            (f.power ? `\n\n${f.power}/${f.toughness}` : '') + (f.loyalty ? `\n\nLoyalty: ${f.loyalty}` : '')
        }));
        const q = name.trim().toLowerCase(), f = Math.max(0, faces.findIndex(x => x.name.toLowerCase() === q));
        commit();
        const n = state.cards.length;
        state.cards.push({
          id: nextId++, name: j.name, faces, f, text: false, boxes: [],
          x: 60 + (n % 6) * 40 + Math.random() * 20, y: 60 + (n % 6) * 30 + Math.random() * 20
        });
        msg.textContent = ''; $('name').value = ''; render();
      } catch (err) { msg.textContent = err.message; }
    }

    const input = $('name');
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && input.value.trim()) addCard(input.value.trim()); e.stopPropagation(); });
    let tm;
    input.addEventListener('input', () => {
      clearTimeout(tm);
      const q = input.value.trim(); if (q.length < 2) return;
      tm = setTimeout(async () => {
        const j = await (await fetch('https://api.scryfall.com/cards/autocomplete?q=' + encodeURIComponent(q))).json();
        $('sugg').innerHTML = (j.data || []).map(n => `<option value="${n.replace(/"/g, '&quot;')}">`).join('');
      }, 200);
    });

    function turn() {
      const c = sel && sel[0] === 'c' && cardOf(+sel.slice(1));
      if (!c || c.faces.length < 2) { msg.textContent = 'Select a two-faced card'; return; }
      commit(); c.f = (c.f + 1) % c.faces.length; render();
    }
    $('turn').onclick = turn;

    function setMode(m) {
      mode = mode === m ? 'move' : m;
      document.body.className = 'mode-' + mode;
      $('arrow').style.fontWeight = mode === 'arrow' ? 'bold' : '';
      $('box').style.fontWeight = mode === 'box' ? 'bold' : '';
      $('text').style.fontWeight = mode === 'text' ? 'bold' : '';
    }
    $('arrow').onclick = () => setMode('arrow'); $('box').onclick = () => setMode('box'); $('text').onclick = () => setMode('text');
    $('undo').onclick = undo; $('del').onclick = remove;
    $('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    let loading = true; // don't rewrite the URL while the initial cards are still loading
    function syncUrl() {
      if (loading) return;
      const p = new URLSearchParams();
      state.cards.forEach(c => p.append('c', c.faces[c.f].name)); // current face, so reloading shows the same side
      const url = location.pathname + (state.cards.length ? '?' + p : '');
      if (url !== location.pathname + location.search) window.history.replaceState(null, '', url); // `history` is the undo stack here
    }

    (async () => {
      for (const name of new URLSearchParams(location.search).getAll('c')) await addCard(name);
      history.length = 0; // loaded cards are not undoable
      loading = false; syncUrl();
    })();

    addEventListener('keydown', e => {
      if (e.key === 'r') turn();
      else if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); }
      else if (e.key === 'a') setMode('arrow');
      else if (e.key === 'b') setMode('box');
      else if (e.key === 't') { e.preventDefault(); setMode('text'); }
      else if (e.key === 'Escape') { if (mode !== 'move') setMode(mode); }
      else if (e.key === 'f') $('fs').click();
      else if (e.key === 'Delete' || e.key === 'Backspace') remove();
      else if (e.key === '/') { e.preventDefault(); input.focus(); }
    });
  </script>
</body>

</html>
